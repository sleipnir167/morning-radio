program:
  title: 朝の散歩ラジオ
  personality: ナナ
  subtitle: 毎朝の散歩のおともに、今日の空気と話のタネを

location:
  name: 東京
  latitude: 35.6895
  longitude: 139.6917
  timezone: Asia/Tokyo
  morning_hours: [6, 7, 8, 9]

script:
  chapters: 8
  chars_per_chapter: 1100
  total_chars_min: 8000
  total_chars_max: 12000      # 8章×1,100字＋オープニング/つなぎ/エンディングで約1万字・音声30分前後

llm:
  provider: gemini            # gemini | openrouter
  gemini_model: gemini-3.6-flash
  openrouter_model: deepseek/deepseek-v4-pro

  # 工程ごとのモデル上書き。空なら上の既定モデルを使う。
  # 無料枠は日あたりのリクエスト数がモデルごとに独立しているので、
  # 1日に何度も作り直すなら本文だけ枠の大きいモデルに逃がす（下の light プロファイル）。
  models:
    outline: ""
    chapter: ""
    assemble: ""
  temperature: 0.9
  max_output_tokens: 16384    # 1章1,100字＋思考トークンの余裕を見て多めに取る
  retries: 3
  rate_limit_retries: 6       # 429は待てば通るので、失敗回数とは別に数える

tts:
  voice: ja-JP-NanamiNeural   # Edge-TTSの日本語は ja-JP-NanamiNeural と ja-JP-KeitaNeural の2つだけ
  rate: +8%
  pitch: +0Hz
  volume: +0%
  pause_ms: 700               # 【SE: 間】に挿入する無音の長さ
  chunk_chars: 1200

history:
  lookback_days: 30
  max_topics_in_prompt: 60

# 曜日ごとのジャンル。0=月曜 ... 6=日曜
genres:
  0: 政治・時事ニュース解説
  1: 科学・テクノロジー
  2: 歴史・地理の雑学
  3: 健康・からだと睡眠
  4: 海外の話題・異文化
  5: カルチャー・アート・ことば
  6: 今週の総集編と深掘り

# ジャンルごとのニュース検索クエリ（Google News RSS）
news_queries:
  政治・時事ニュース解説: [日本 政治, 経済 政策, 国際情勢]
  科学・テクノロジー: [科学 研究, AI 技術, 宇宙]
  歴史・地理の雑学: [歴史 発見, 考古学, 世界遺産]
  健康・からだと睡眠: [健康 研究, 睡眠, 栄養]
  海外の話題・異文化: [海外 話題, 世界 文化, 欧州]
  カルチャー・アート・ことば: [芸術 展覧会, 文学, 音楽]
  今週の総集編と深掘り: [今週 ニュース]

publish:
  podcast:
    enabled: true
    base_url: ""              # 空ならGITHUB_REPOSITORYから自動生成
    max_episodes: 60
  gdrive:
    enabled: true
    folder_id: ""             # 環境変数 GDRIVE_FOLDER_ID で上書き可
