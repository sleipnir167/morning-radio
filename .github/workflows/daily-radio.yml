name: 朝の散歩ラジオ

on:
  schedule:
    - cron: "0 19 * * *"    # UTC 19:00 = JST 04:00（5時の散歩に間に合わせる）
  workflow_dispatch:
    inputs:
      genre:
        description: ジャンル（空なら曜日ごとの既定値）
        required: false
        type: string
      chapters:
        description: 章数
        required: false
        default: "8"
        type: string
      chars_per_chapter:
        description: 1章あたりの文字数
        required: false
        default: "1100"
        type: string
      profile:
        description: 品質プロファイル（high=最上位モデル・1日2回まで / light=枠の大きいモデル・1日50回）
        required: false
        default: light
        type: choice
        options: [high, light]
      provider:
        description: LLMプロバイダ
        required: false
        default: gemini
        type: choice
        options: [gemini, openrouter]
      model:
        description: モデル名（空ならconfig.yamlの既定値）
        required: false
        type: string
      voice:
        description: 音声（空ならconfig.yamlの既定値）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-radio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg を用意
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 原稿と音声を生成
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GENRE: ${{ inputs.genre }}
          CHAPTERS: ${{ inputs.chapters }}
          CHARS_PER_CHAPTER: ${{ inputs.chars_per_chapter }}
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_MODEL: ${{ inputs.model }}
          TTS_VOICE: ${{ inputs.voice }}
          # light: 構成と結合だけ 3.5 Flash（1日20回）、本文は 3.5 Flash Lite（1日500回）に逃がす。
          # 定時実行では inputs が空なので config.yaml の既定（3.6 Flash）が使われる。
          LLM_MODEL_OUTLINE: ${{ inputs.profile == 'light' && 'gemini-3.5-flash' || '' }}
          LLM_MODEL_CHAPTER: ${{ inputs.profile == 'light' && 'gemini-3.5-flash-lite' || '' }}
          LLM_MODEL_ASSEMBLE: ${{ inputs.profile == 'light' && 'gemini-3.5-flash' || '' }}
        run: python -m src.main

      - name: リリースとして音声を公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.gen.outputs.tag }}" \
            "${{ steps.gen.outputs.audio_path }}" \
            "${{ steps.gen.outputs.script_path }}" \
            --title "${{ steps.gen.outputs.date }} ${{ steps.gen.outputs.title }}" \
            --notes "自動生成された放送回です。" \
            || gh release upload "${{ steps.gen.outputs.tag }}" \
                 "${{ steps.gen.outputs.audio_path }}" \
                 "${{ steps.gen.outputs.script_path }}" --clobber

      - name: 履歴とフィードをコミット
        env:
          DATE: ${{ steps.gen.outputs.date }}
          MESSAGE: "放送: ${{ steps.gen.outputs.date }} ${{ steps.gen.outputs.title }}"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # docs/ と history/ は生成物なので、行単位のマージは意味を持たない。
          # 押し戻されたらリモートの最新状態を取り直し、この回をその上へ載せ直す。
          for attempt in 1 2 3; do
            git add history docs
            git diff --staged --quiet || git commit -m "$MESSAGE"
            git push && exit 0

            echo "push が押し戻されました。リモートの最新状態へ載せ直します（$attempt回目）"
            git fetch origin
            git reset --soft origin/main
            git checkout origin/main -- history docs
            python -m src.republish "$DATE"
          done

          echo "3回試しても push できませんでした" >&2
          exit 1
